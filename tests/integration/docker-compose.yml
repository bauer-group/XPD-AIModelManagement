# =============================================================================
#  Integration rig: a real MinIO, reached with a least-privilege credential
# -----------------------------------------------------------------------------
#  WHAT  : One MinIO server from the organisation's own image, bootstrapped
#          declaratively by minio-init into a bucket, an IAM policy, a group,
#          a policy-scoped user and a service account. Plus an opt-in console.
#  WHY   : The unit tests run against moto, which accepts almost anything. moto
#          cannot prove hand-rolled multipart semantics, dense part numbering,
#          the "-N" ETag suffix, PartsCount, ListObjectsV2 pagination past 1000
#          keys, batched deletes, orphaned-MPU abort, or MinIO's StorageClass
#          IsValid rejection. Only a real server can. The rig also authenticates
#          with a NON-ROOT, policy-scoped credential on purpose: it proves the
#          tool works under least privilege, so a missing IAM action fails here
#          rather than in production.
#  RUN   : docker compose -f tests/integration/docker-compose.yml up -d --wait
#          export AIMM_IT_ENDPOINT=http://localhost:9800     # the pytest gate
#          pytest tests -m integration                          # marker, not path
#          docker compose -f tests/integration/docker-compose.yml down -v
#
#  PORTS : The S3 API is published on 9800, NOT 9000, and the console on 9801,
#          NOT 9001. Developers routinely run their own MinIO on 9000/9001 and
#          a rig that steals those ports is a rig nobody starts twice. Override
#          with AIMM_RIG_API_PORT / AIMM_RIG_CONSOLE_PORT if 9800/9801 clash.
#
#  ##  HONEST SCOPE — READ BEFORE TRUSTING A GREEN RUN  ######################
#  #  This rig speaks PLAIN HTTP. botocore only emits the aws-chunked
#  #  checksum TRAILER over HTTPS, so this rig CANNOT reproduce the
#  #  production trailer-rejection failure that is this project's #1
#  #  unverified risk. A green integration run proves multipart, pagination,
#  #  metadata, addressing and abort semantics against a real server. It
#  #  proves NOTHING about checksum-trailer compatibility. That residual
#  #  risk is exactly why S3Destination.probe() probes at runtime instead of
#  #  trusting a backend table. See README.md, "What this rig cannot prove".
#  ###########################################################################
#
#  CREDENTIALS: every value below is a throwaway, local-only, non-secret rig
#  credential. It grants access to nothing but a container on your laptop.
#  They are checked in deliberately so the rig is one command to start, and
#  they must stay allowlisted in .gitleaks.toml — a secret scanner that cries
#  wolf on the test rig trains everyone to ignore it.
# =============================================================================

name: aimm-it

services:
  # ---------------------------------------------------------------- S3 server
  minio:
    image: ghcr.io/bauer-group/cs-minio/minio:${AIMM_RIG_MINIO_TAG:-latest}
    container_name: aimm_it_minio
    # The image's own CMD also opens the legacy browser console on :9001. We
    # only want the S3 API, and MINIO_BROWSER=off makes :9001 pointless anyway.
    command: server --address ":9000" /data
    environment:
      MINIO_ROOT_USER: ${AIMM_RIG_ROOT_USER:-aimm-rig-root}
      MINIO_ROOT_PASSWORD: ${AIMM_RIG_ROOT_PASSWORD:-aimm-rig-root-secret}
      # Must match AIMM_IT_REGION, or every signed request gets a region redirect.
      MINIO_REGION_NAME: ${AIMM_IT_REGION:-eu-north1}
      MINIO_BROWSER: "off"
    ports:
      - "${AIMM_RIG_API_PORT:-9800}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks: [rig]

  # ------------------------------------------------------------- bootstrapper
  # One-shot and idempotent. Reads /app/config/init.json (below) on top of the
  # image's built-in default.json, which always provisions a console admin from
  # CONSOLE_USER / CONSOLE_PASSWORD — those two are therefore mandatory even
  # when the console profile is not started.
  minio-init:
    image: ghcr.io/bauer-group/cs-minio/minio-init:${AIMM_RIG_MINIO_TAG:-latest}
    container_name: aimm_it_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${AIMM_RIG_ROOT_USER:-aimm-rig-root}
      MINIO_ROOT_PASSWORD: ${AIMM_RIG_ROOT_PASSWORD:-aimm-rig-root-secret}
      MINIO_WAIT_TIMEOUT: "60"
      CONSOLE_USER: ${AIMM_RIG_CONSOLE_USER:-aimm-rig-console}
      CONSOLE_PASSWORD: ${AIMM_RIG_CONSOLE_PASSWORD:-aimm-rig-console-secret}
      # Resolved by the init container itself out of the `${...}` placeholders
      # in init.json. Missing values make the bootstrap fail loudly, not quietly.
      AIMM_IT_BUCKET: ${AIMM_IT_BUCKET:-aimm-it}
      AIMM_IT_REGION: ${AIMM_IT_REGION:-eu-north1}
      AIMM_IT_ACCESS_KEY: ${AIMM_IT_ACCESS_KEY:-aimm-it-user}
      AIMM_IT_SECRET_KEY: ${AIMM_IT_SECRET_KEY:-aimm-it-user-secret}
    configs:
      - source: minio_init
        target: /app/config/init.json
    volumes:
      # Service-account credentials are GENERATED by MinIO, never predetermined,
      # and the init container writes them here as JSON mode 0600. The mount
      # point must be /data/credentials: the image pre-creates that path owned
      # by its non-root `init` user, and Docker seeds a fresh named volume with
      # the image path's ownership. Mounting anywhere else yields a root-owned
      # directory and the bootstrap dies with EACCES after having already
      # created the service account — leaving a secret that can never be read.
      # See README.md, "The service account".
      - rig_credentials:/data/credentials
    networks: [rig]

  # ------------------------------------------------- opt-in, for humans only
  # `--profile console` to browse objects locally. CI never starts this.
  minio-console:
    image: ghcr.io/bauer-group/cs-minio/minio-console:${AIMM_RIG_MINIO_TAG:-latest}
    container_name: aimm_it_minio_console
    profiles: ["console"]
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CONSOLE_MINIO_SERVER: http://minio:9000
      CONSOLE_MINIO_REGION: ${AIMM_IT_REGION:-eu-north1}
    ports:
      - "${AIMM_RIG_CONSOLE_PORT:-9801}:9090"
    networks: [rig]

# -----------------------------------------------------------------------------
#  The declarative bootstrap, inline so the rig stays a single file.
# -----------------------------------------------------------------------------
#  THE DOUBLED `$$` IS LOAD-BEARING. Compose interpolates `${...}` inside
#  inline `content:` BEFORE the container ever sees it, so a single-dollar
#  placeholder would be substituted by compose — usually to an empty string —
#  and the bootstrap would create a user with a blank access key. `$${VAR}`
#  makes compose emit the literal `${VAR}`, which minio-init then resolves from
#  ITS OWN environment. The same escape is why the schema key is `$$schema`.
#
#  ON THE POLICY: it grants exactly the actions S3Destination actually calls,
#  and nothing more. An over-broad test policy hides a real permission bug from
#  production, so the omissions below are deliberate:
#
#    * s3:CreateBucket           — ensure_bucket defaults to off. Withholding
#                                  this proves the default stays off; if anyone
#                                  flips it, integration goes red instead of
#                                  quietly creating buckets in production.
#    * s3:GetObjectAttributes    — support is unverified on MinIO. probe()
#                                  treats it as a DISCOVERED capability, so the
#                                  correct outcome when it is absent is "probe
#                                  says no", not "test fails".
#    * s3:ListMultipartUploadParts
#                                — destination.py never calls list_parts. It
#                                  completes multipart uploads from the part
#                                  list it already holds, and abort_stale_uploads
#                                  uses list_multipart_uploads (which needs the
#                                  bucket-level s3:ListBucketMultipartUploads,
#                                  granted below) — not list_parts. The org's
#                                  production policies do include this action;
#                                  the rig omits it on purpose so that the day
#                                  someone adds a list_parts call, the rig says
#                                  so. If CompleteMultipartUpload ever returns
#                                  AccessDenied here, adding it back is the fix
#                                  — and that is a finding worth having.
configs:
  minio_init:
    content: |
      {
        "$$schema": "https://github.com/bauer-group/CS-MinIO/init.schema.json",
        "buckets": [
          {
            "name": "$${AIMM_IT_BUCKET}",
            "region": "$${AIMM_IT_REGION}",
            "versioning": false,
            "policy": "private"
          }
        ],
        "policies": [
          {
            "name": "pAimmIt",
            "statements": [
              {
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject",
                  "s3:PutObject",
                  "s3:DeleteObject",
                  "s3:AbortMultipartUpload"
                ],
                "Resource": ["arn:aws:s3:::$${AIMM_IT_BUCKET}/*"]
              },
              {
                "Effect": "Allow",
                "Action": [
                  "s3:ListBucket",
                  "s3:GetBucketLocation",
                  "s3:ListBucketMultipartUploads"
                ],
                "Resource": ["arn:aws:s3:::$${AIMM_IT_BUCKET}"]
              }
            ]
          }
        ],
        "groups": [
          {
            "name": "gAimmIt",
            "policies": ["pAimmIt"]
          }
        ],
        "users": [
          {
            "access_key": "$${AIMM_IT_ACCESS_KEY}",
            "secret_key": "$${AIMM_IT_SECRET_KEY}",
            "groups": ["gAimmIt"],
            "policies": ["pAimmIt"]
          }
        ],
        "service_accounts": [
          {
            "user": "$${AIMM_IT_ACCESS_KEY}",
            "name": "aimm-it-sa",
            "description": "Least-privilege service account for the aimm hf-backup integration rig",
            "policy": "pAimmIt"
          }
        ]
      }

networks:
  rig:

volumes:
  minio_data:
  rig_credentials:
