# =============================================================================
#  🧪 Tests
# -----------------------------------------------------------------------------
#  WHAT         : Lint (ruff), type-check (mypy strict), and run the unit suite
#                 across every supported Python version.
#  WHEN         : Every push to main and every pull request touching code.
#  PRODUCES     : A pass/fail gate, plus a coverage summary in the job log.
#  REQUIREMENTS : None. No secrets, no Docker, no network -- integration tests
#                 are excluded by `-m "not integration"`, which is what keeps
#                 this gate hermetic.
#  PERMISSIONS  : contents: read only.
# =============================================================================
name: 🧪 Tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '*.MD']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '*.MD']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔍 Quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor runs first. A failure on 3.12 with a pass on 3.14 means
        # somebody used syntax newer than `requires-python` allows.
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: 📦 Install
        run: pip install -e ".[dev]"

      - name: 🎨 Lint (ruff)
        run: ruff check src tests

      - name: 🔎 Type-check (mypy strict)
        run: mypy src/bg_ai_model_management

      # Integration tests need Docker and a live S3 endpoint; they run in
      # integration.yml, on their own schedule.
      - name: 🧪 Test
        run: pytest -q -m "not integration" --cov=src/bg_ai_model_management --cov-report=term-missing
