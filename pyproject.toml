[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimm"
version = "0.1.0"
description = "BAUER GROUP AI model management toolkit — lifecycle backup of Hugging Face repositories to S3-compatible storage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Karl Bauer", email = "kb@de.bauer-group.com" }]
keywords = ["huggingface", "backup", "s3", "minio", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]
dependencies = [
    "huggingface_hub>=1.24.0,<2",
    "boto3>=1.36.0",
    "botocore>=1.36.0",
    "httpx>=0.28.1,<1",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.1.4",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "moto[s3]>=5.2.2",
    "ruff>=0.15.22",
    "mypy>=2.3.0",
    "types-boto3[s3]>=1.43.51",
]

[project.urls]
Homepage = "https://github.com/bauer-group/XPD-AIModelManagement"
Source = "https://github.com/bauer-group/XPD-AIModelManagement"
Issues = "https://github.com/bauer-group/XPD-AIModelManagement/issues"

[project.scripts]
aimm = "aimm.main:main"

# Tools register here; the root CLI discovers and mounts them at runtime as
# typer.Typer sub-apps. Tools #2..#N mount without editing the core.
[project.entry-points."aimm.tools"]
hf-backup = "aimm.tools.hfbackup.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"
markers = ["integration: requires a live MinIO (set AIMM_IT_ENDPOINT)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "ARG", "TID"]
ignore = ["B008"] # typer.Option(...) in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"] # pytest fixtures are legitimately unused arguments

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true
